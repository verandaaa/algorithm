<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 500" width="750" height="500" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect width="750" height="500" fill="#ffffff"/>

  <!-- 헤더: Map으로 찾기 -->
  <text x="30" y="34" font-size="17" font-weight="bold" fill="#111827">callings: "kai"</text>
  <text x="160" y="34" font-size="15" fill="#374151">→ map.get("kai") = 3 → infos[3] 을 O(1)로 찾음</text>
  <text x="30" y="58" font-size="13" fill="#6b7280">위쪽 화살표 = back (뒤 선수), 아래쪽 화살표 = front (앞 선수)</text>

  <!-- 추월 전 -->
  <text x="30" y="92" font-size="14" font-weight="bold" fill="#374151">추월 전</text>
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <text x="226" y="104" fill="#2563eb">aa</text>
    <text x="374" y="104" fill="#2563eb">a</text>
    <text x="522" y="104" fill="#ea580c">b (불린 선수)</text>
    <text x="670" y="104" fill="#2563eb">bb</text>
  </g>
  <g stroke-width="1.5">
    <rect x="30" y="112" width="96" height="56" rx="8" fill="#f9fafb" stroke="#9ca3af"/>
    <rect x="178" y="112" width="96" height="56" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <rect x="326" y="112" width="96" height="56" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <rect x="474" y="112" width="96" height="56" rx="8" fill="#fff7ed" stroke="#ea580c"/>
    <rect x="622" y="112" width="96" height="56" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  </g>
  <g text-anchor="middle">
    <g font-size="16" fill="#111827">
      <text x="78" y="138">mumu</text>
      <text x="226" y="138">soe</text>
      <text x="374" y="138">poe</text>
      <text x="522" y="138">kai</text>
      <text x="670" y="138">mine</text>
    </g>
    <g font-size="12" fill="#6b7280">
      <text x="78" y="157">number 0</text>
      <text x="226" y="157">number 1</text>
      <text x="374" y="157">number 2</text>
      <text x="522" y="157">number 3</text>
      <text x="670" y="157">number 4</text>
    </g>
  </g>
  <g stroke="#9ca3af" stroke-width="1.5" fill="none">
    <line x1="128" y1="131" x2="176" y2="131" marker-end="url(#g)"/>
    <line x1="176" y1="149" x2="128" y2="149" marker-end="url(#g)"/>
    <line x1="276" y1="131" x2="324" y2="131" marker-end="url(#g)"/>
    <line x1="324" y1="149" x2="276" y2="149" marker-end="url(#g)"/>
    <line x1="424" y1="131" x2="472" y2="131" marker-end="url(#g)"/>
    <line x1="472" y1="149" x2="424" y2="149" marker-end="url(#g)"/>
    <line x1="572" y1="131" x2="620" y2="131" marker-end="url(#g)"/>
    <line x1="620" y1="149" x2="572" y2="149" marker-end="url(#g)"/>
  </g>

  <!-- 가운데 화살표 -->
  <line x1="375" y1="184" x2="375" y2="236" stroke="#374151" stroke-width="2" marker-end="url(#d)"/>
  <text x="392" y="215" font-size="14" fill="#374151">링크 6개만 바꿈 (배열은 그대로)</text>

  <!-- 추월 후 -->
  <text x="30" y="262" font-size="14" font-weight="bold" fill="#374151">추월 후</text>
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <text x="226" y="274" fill="#2563eb">aa</text>
    <text x="374" y="274" fill="#ea580c">b</text>
    <text x="522" y="274" fill="#2563eb">a</text>
    <text x="670" y="274" fill="#2563eb">bb</text>
  </g>
  <g stroke-width="1.5">
    <rect x="30" y="282" width="96" height="56" rx="8" fill="#f9fafb" stroke="#9ca3af"/>
    <rect x="178" y="282" width="96" height="56" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <rect x="326" y="282" width="96" height="56" rx="8" fill="#fff7ed" stroke="#ea580c"/>
    <rect x="474" y="282" width="96" height="56" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <rect x="622" y="282" width="96" height="56" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  </g>
  <g text-anchor="middle">
    <g font-size="16" fill="#111827">
      <text x="78" y="308">mumu</text>
      <text x="226" y="308">soe</text>
      <text x="374" y="308">kai</text>
      <text x="522" y="308">poe</text>
      <text x="670" y="308">mine</text>
    </g>
    <g font-size="12" fill="#6b7280">
      <text x="78" y="327">number 0</text>
      <text x="226" y="327">number 1</text>
      <text x="374" y="327">number 3</text>
      <text x="522" y="327">number 2</text>
      <text x="670" y="327">number 4</text>
    </g>
  </g>
  <g stroke="#9ca3af" stroke-width="1.5" fill="none">
    <line x1="128" y1="301" x2="176" y2="301" marker-end="url(#g)"/>
    <line x1="176" y1="319" x2="128" y2="319" marker-end="url(#g)"/>
  </g>
  <g stroke="#ea580c" stroke-width="2" fill="none">
    <line x1="276" y1="301" x2="324" y2="301" marker-end="url(#o)"/>
    <line x1="324" y1="319" x2="276" y2="319" marker-end="url(#o)"/>
    <line x1="424" y1="301" x2="472" y2="301" marker-end="url(#o)"/>
    <line x1="472" y1="319" x2="424" y2="319" marker-end="url(#o)"/>
    <line x1="572" y1="301" x2="620" y2="301" marker-end="url(#o)"/>
    <line x1="620" y1="319" x2="572" y2="319" marker-end="url(#o)"/>
  </g>

  <!-- 바뀐 링크와 코드 -->
  <rect x="30" y="362" width="688" height="118" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <g font-size="14" fill="#111827">
    <text x="48" y="390"><tspan fill="#ea580c" font-weight="bold">soe ⇄ kai</tspan></text>
    <text x="48" y="416"><tspan fill="#ea580c" font-weight="bold">kai ⇄ poe</tspan></text>
    <text x="48" y="442"><tspan fill="#ea580c" font-weight="bold">poe ⇄ mine</tspan></text>
  </g>
  <g font-size="14" fill="#111827" font-family="Consolas, 'D2Coding', monospace">
    <text x="150" y="390">infos[aa].back = b</text>
    <text x="150" y="416">infos[b].back = a</text>
    <text x="150" y="442">infos[a].back = bb</text>
    <text x="370" y="390">infos[b].front = aa</text>
    <text x="370" y="416">infos[a].front = b</text>
    <text x="370" y="442">infos[bb].front = a</text>
  </g>
  <text x="48" y="468" font-size="13" fill="#6b7280">aa가 null이면 b가 새 first → 마지막에 first부터 back을 따라가며 답을 만든다.</text>
</svg>
