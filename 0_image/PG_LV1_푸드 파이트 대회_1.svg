<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 420" width="750" height="420" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect width="750" height="420" fill="#ffffff"/>

  <!-- 헤더 -->
  <text x="30" y="34" font-size="17" font-weight="bold" fill="#111827" font-family="Consolas, 'D2Coding', monospace">food = [1, 3, 4, 6]</text>
  <text x="250" y="34" font-size="14" fill="#6b7280">음식마다 절반만 front에 놓고, 뒤집어서 back을 만든다</text>

  <!-- 표 -->
  <g font-size="14" font-weight="bold" fill="#374151" font-family="Consolas, 'D2Coding', monospace">
    <text x="30" y="79">i</text>
    <text x="30" y="109">food[i]</text>
    <text x="30" y="139">count</text>
    <text x="30" y="169">str</text>
  </g>
  <g stroke-width="1.5">
    <rect x="150" y="60" width="110" height="120" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
    <rect x="270" y="60" width="110" height="120" rx="6" fill="#fff7ed" stroke="#ea580c"/>
    <rect x="390" y="60" width="110" height="120" rx="6" fill="#fff7ed" stroke="#ea580c"/>
    <rect x="510" y="60" width="110" height="120" rx="6" fill="#fff7ed" stroke="#ea580c"/>
  </g>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="150" y1="90" x2="620" y2="90"/>
    <line x1="150" y1="120" x2="620" y2="120"/>
    <line x1="150" y1="150" x2="620" y2="150"/>
  </g>
  <g font-size="15" text-anchor="middle" font-family="Consolas, 'D2Coding', monospace">
    <g fill="#6b7280">
      <text x="205" y="80">0</text>
      <text x="205" y="110">1</text>
      <text x="205" y="140">–</text>
      <text x="205" y="170">–</text>
    </g>
    <g fill="#111827">
      <text x="325" y="80">1</text>
      <text x="445" y="80">2</text>
      <text x="565" y="80">3</text>
      <text x="325" y="110">3</text>
      <text x="445" y="110">4</text>
      <text x="565" y="110">6</text>
      <text x="325" y="140">1</text>
      <text x="445" y="140">2</text>
      <text x="565" y="140">3</text>
    </g>
    <g fill="#ea580c" font-weight="bold">
      <text x="325" y="170">"1"</text>
      <text x="445" y="170">"22"</text>
      <text x="565" y="170">"333"</text>
    </g>
  </g>
  <text x="635" y="80" font-size="12" fill="#6b7280">0번은 물</text>
  <text x="635" y="98" font-size="12" fill="#6b7280">(반복에서 뺌)</text>
  <text x="635" y="140" font-size="12" fill="#6b7280">홀수면 1개 남김</text>

  <!-- 아래 화살표 -->
  <line x1="375" y1="190" x2="375" y2="222" stroke="#374151" stroke-width="2" marker-end="url(#d)"/>

  <!-- 답 문자열 -->
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <text x="205" y="244" fill="#ea580c">front</text>
    <text x="373" y="244" fill="#6b7280">"0"</text>
    <text x="541" y="244" fill="#2563eb">back = front 뒤집기</text>
  </g>
  <g stroke-width="1.5" fill="none">
    <path d="M63,256 V250 H347 V256" stroke="#ea580c"/>
    <path d="M399,256 V250 H683 V256" stroke="#2563eb"/>
  </g>
  <g stroke-width="1.5">
    <rect x="63" y="262" width="44" height="44" rx="6" fill="#fff7ed" stroke="#ea580c"/>
    <rect x="111" y="262" width="44" height="44" rx="6" fill="#fff7ed" stroke="#ea580c"/>
    <rect x="159" y="262" width="44" height="44" rx="6" fill="#fff7ed" stroke="#ea580c"/>
    <rect x="207" y="262" width="44" height="44" rx="6" fill="#fff7ed" stroke="#ea580c"/>
    <rect x="255" y="262" width="44" height="44" rx="6" fill="#fff7ed" stroke="#ea580c"/>
    <rect x="303" y="262" width="44" height="44" rx="6" fill="#fff7ed" stroke="#ea580c"/>
    <rect x="351" y="262" width="44" height="44" rx="6" fill="#f9fafb" stroke="#9ca3af"/>
    <rect x="399" y="262" width="44" height="44" rx="6" fill="#eff6ff" stroke="#2563eb"/>
    <rect x="447" y="262" width="44" height="44" rx="6" fill="#eff6ff" stroke="#2563eb"/>
    <rect x="495" y="262" width="44" height="44" rx="6" fill="#eff6ff" stroke="#2563eb"/>
    <rect x="543" y="262" width="44" height="44" rx="6" fill="#eff6ff" stroke="#2563eb"/>
    <rect x="591" y="262" width="44" height="44" rx="6" fill="#eff6ff" stroke="#2563eb"/>
    <rect x="639" y="262" width="44" height="44" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  </g>
  <g font-size="18" text-anchor="middle" fill="#111827" font-family="Consolas, 'D2Coding', monospace">
    <text x="85" y="290">1</text>
    <text x="133" y="290">2</text>
    <text x="181" y="290">2</text>
    <text x="229" y="290">3</text>
    <text x="277" y="290">3</text>
    <text x="325" y="290">3</text>
    <text x="373" y="290" fill="#6b7280">0</text>
    <text x="421" y="290">3</text>
    <text x="469" y="290">3</text>
    <text x="517" y="290">3</text>
    <text x="565" y="290">2</text>
    <text x="613" y="290">2</text>
    <text x="661" y="290">1</text>
  </g>

  <!-- 코드 -->
  <rect x="30" y="326" width="688" height="80" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <g font-size="14" fill="#111827" font-family="Consolas, 'D2Coding', monospace">
    <text x="48" y="352">let count = Math.floor(food[i] / 2);</text>
    <text x="48" y="374">let back = [...front].reverse().join("");</text>
    <text x="48" y="396">answer = front + "0" + back;</text>
  </g>
</svg>
