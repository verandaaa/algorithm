name: Update README

on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - "!README.md"
      - "scripts/generate-readme.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 풀이 날짜를 git 히스토리에서 읽기 때문에 전체 히스토리가 필요

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/generate-readme.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then
            echo "README unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update README"
          git pull --rebase origin main
          git push
